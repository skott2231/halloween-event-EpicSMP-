# Builds the plugin jar automatically on GitHub - no software needed on your PC.
# 1. Upload this whole folder to a new GitHub repository.
# 2. Open the "Actions" tab, pick "Build plugin", wait ~1 minute.
# 3. Open the finished run and download the artifact "HalloweenEvent" (a zip with the jar).
name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: HalloweenEvent
          path: target/HalloweenEvent-*.jar
